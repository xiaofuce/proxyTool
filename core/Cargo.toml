[package]
name = "proxy-tool-core"
version = "0.1.0"
edition = "2021"
description = "SSH 隧道引擎核心 (纯 Rust, 无 GUI 依赖)"

[lib]
name = "proxy_tool_core"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
russh = { version = "0.62.6", default-features = false, features = ["ring", "flate2", "rsa"] }
tokio = { version = "1", features = ["net", "io-util", "rt", "rt-multi-thread", "sync", "macros", "time"] }
ssh-key = "0.7.0-rc.11"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
# 命令生成页用户数据加密落盘 (cmd_recipes.rs); getrandom 供密钥/nonce
aes-gcm = "0.10"
getrandom = "0.3"

[dev-dependencies]
log = "0.4"
# e2e 密钥认证测试: 生成随机 ed25519 密钥对 (与 russh 0.62 同版本系)
rand = { version = "0.10", features = ["thread_rng"] }
