<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232a47"/>
      <stop offset="1" stop-color="#121527"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#6d8dff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#6d8dff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arch" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#5470f4"/>
      <stop offset="1" stop-color="#9db8ff"/>
    </linearGradient>
  </defs>

  <!-- rounded-square background -->
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#glow)"/>

  <!-- through connection: local (left) to remote (right) -->
  <line x1="132" y1="648" x2="892" y2="648" stroke="#c9d4f7" stroke-width="40" stroke-linecap="round"/>

  <!-- tunnel arch over the line -->
  <path d="M 254 648 A 258 258 0 0 1 770 648" fill="none" stroke="url(#arch)" stroke-width="92" stroke-linecap="round"/>

  <!-- endpoints -->
  <circle cx="132" cy="648" r="58" fill="#8f9cbe"/>
  <circle cx="892" cy="648" r="58" fill="#f2f5ff"/>
</svg>
