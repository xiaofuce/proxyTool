[package]
name = "proxy-tool"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This is only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "proxy_tool_lib"
# R8: 桌面应用只需 rlib (staticlib/cdylib 是移动端/插件所需, 徒增编译时间)
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(windows)'.dependencies]
# CloseRequested 收托盘兜底用同步 ShowWindow (dispatcher hide 在该事件期间
# 偶发不生效, 实测 hide 返回 ok 但窗口仍可见)。版本钉 0.61 系: 随依赖树
# (tauri 解析到 0.61.2, Cargo.lock 已含; ustc 镜像索引尚无 0.62)
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
# 开机自启 (P6): Windows 写 HKCU Run 键, 无需管理员
tauri-plugin-autostart = "2.5"
serde = { version = "1", features = ["derive"] }
# 隧道引擎 (russh/tokio 等依赖都在 core, GUI 层只做桥接)
proxy-tool-core = { path = "../core" }
tokio = { version = "1", features = ["sync", "time"] }
# R9 诊断: 日志时间戳 (已在依赖树, 零新增编译) + 进程内存采样 (跨平台, 轻量)
chrono = "0.4"
memory-stats = "1"
