[package]
name = "proxy-tool"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This is only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "proxy_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
# 开机自启 (P6): Windows 写 HKCU Run 键, 无需管理员
tauri-plugin-autostart = "2.5"
serde = { version = "1", features = ["derive"] }
# 隧道引擎 (russh/tokio 等依赖都在 core, GUI 层只做桥接)
proxy-tool-core = { path = "../core" }
tokio = { version = "1", features = ["sync", "time"] }
